name: ridecoop_core
description: Shared code for the Ride Coop rider and driver apps (API client, sign-in, brand, live updates, chat, calls).
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  url_launcher: ^6.3.1
  # Live updates over the server's websocket (Laravel Reverb, Pusher protocol).
  web_socket_channel: ^3.0.1
  # In-app audio/video calls between rider and driver (WebRTC).
  # Kept below 1.0: from 1.0 the Android WebRTC library (137+) bundles org.jni_zero classes that clash with the
  # Google Navigation SDK in the driver app ("Duplicate class org.jni_zero..."). 0.14.x uses WebRTC 125.
  flutter_webrtc: ">=0.14.2 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
