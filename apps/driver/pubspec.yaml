name: ridecoop_driver
description: Ride Coop driver app (Android, iOS).
publish_to: none
# Play needs a versionCode above the current Apptunix build — confirm before the first store upload.
version: 2.0.0+100

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  ridecoop_core:
    path: ../core
  http: ^1.2.2
  google_maps_flutter: ^2.10.0
  geolocator: ">=13.0.1 <16.0.0"
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
