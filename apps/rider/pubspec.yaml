name: ridecoop_rider
description: Ride Coop rider app (Android, iOS, web).
publish_to: none
# Play needs a versionCode above the current Apptunix build — confirm before the first store upload.
version: 2.0.0+100

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  ridecoop_core:
    path: ../core
  http: ^1.2.2
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  google_maps_flutter: ^2.10.0
  geolocator: ">=13.0.1 <16.0.0"
  url_launcher: ^6.3.1
  # Push notifications (order and ride updates while the app is closed). Android only for now.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
