name: Driver app

on:
  push:
    branches: [main]
    paths: ['apps/driver/**', 'apps/core/**', '.github/workflows/driver-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: driver-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  ANDROID_APP_ID: com.ridecoopandroid.driver
  API_BASE: https://api.ridecoop.net/api/v1
  # Repository secret; builds still succeed without it (maps are just blank).
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get
      - name: Analyze shared core
        working-directory: apps/core
        run: flutter pub get && flutter analyze --no-fatal-infos
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.txt
      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test-output.txt
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=API_BASE=$API_BASE 2>&1 | tee /tmp/build.txt
      # Logs aren't reachable from the dev workspace; on failure publish them to the ci-logs branch.
      - name: Publish test log on failure
        if: failure()
        working-directory: .
        run: |
          mkdir -p /tmp/ci && cp /tmp/test-output.txt /tmp/ci/ 2>/dev/null || true; cp /tmp/analyze.txt /tmp/ci/ 2>/dev/null || true; tail -c 200000 /tmp/build.txt > /tmp/ci/build.txt 2>/dev/null || true
          cd /tmp/ci && git init -q && git checkout -q -b ci-logs-driver
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${GITHUB_SHA}" > sha.txt && git add -A && git commit -qm "Test log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-driver
      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          APK=ridecoop-driver-debug-$SHA.apk
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "driver-dev-$SHA" "$APK" "$APK.sha256" --prerelease \
            --title "Driver app test build $SHA" --notes "Debug build of the Ride Coop Driver app from $SHA, talking to $API_BASE. Not for the store."
