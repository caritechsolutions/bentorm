name: Rider app

on:
  push:
    branches: [main]
    paths: ['apps/rider/**', 'apps/core/**', '.github/workflows/rider-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rider-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  ANDROID_APP_ID: com.ridecoopcustomer.android
  API_BASE: https://api.ridecoop.net/api/v1
  # Repository secret; builds still succeed without it (maps are just blank).
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      # One-time: generate the android/ios/web platform folders and commit them back.
      - name: Generate platform folders (first run only)
        run: |
          if [ -d android ]; then echo "platform folders present"; exit 0; fi
          flutter create --org net.ridecoop --project-name ridecoop_rider --platforms android,ios,web --no-pub .
          rm -f test/widget_test.dart
          GRADLE=android/app/build.gradle.kts
          sed -i -E "s|applicationId = \"[^\"]+\"|applicationId = \"$ANDROID_APP_ID\"|" "$GRADLE"
          grep -n 'applicationId\|namespace' "$GRADLE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Rider app: generate platform folders (flutter create ${FLUTTER_VERSION})"
          git push

      - run: flutter pub get
      - name: Analyze shared core
        working-directory: apps/core
        run: flutter pub get && flutter analyze --no-fatal-infos
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.txt
      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test-output.txt
      # Logs aren't reachable from the dev workspace; on failure publish them to the ci-logs branch.
      - name: Publish test log on failure
        if: failure()
        working-directory: .
        run: |
          mkdir -p /tmp/ci && cp /tmp/test-output.txt /tmp/ci/ 2>/dev/null || true; cp /tmp/analyze.txt /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci && git init -q && git checkout -q -b ci-logs
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${GITHUB_SHA}" > sha.txt && git add -A && git commit -qm "Test log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
      - run: flutter build apk --debug --dart-define=API_BASE=$API_BASE
      - name: Build web
        run: |
          flutter build web --release --dart-define=API_BASE=$API_BASE
          sed -i "s|__GOOGLE_MAPS_API_KEY__|${GOOGLE_MAPS_API_KEY}|" build/web/index.html
          grep -c "maps.googleapis.com/maps/api/js" build/web/index.html
          [ -n "$GOOGLE_MAPS_API_KEY" ] && echo "Maps key: set" || echo "::warning::GOOGLE_MAPS_API_KEY secret not set - maps will be blank"

      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          APK=ridecoop-rider-debug-$SHA.apk
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "rider-dev-$SHA" "$APK" "$APK.sha256" --prerelease \
            --title "Rider app test build $SHA" --notes "Debug build of the Ride Coop rider app from $SHA, talking to $API_BASE. Not for the store."

      - uses: actions/upload-artifact@v4
        with:
          name: rider-web-${{ github.sha }}
          path: apps/rider/build/web
          retention-days: 14
