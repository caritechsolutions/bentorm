# Bentorm API — listens on 8080; put Nginx Proxy Manager in front for TLS.
server {
    listen 8080;
    server_name _;
    root /opt/bentorm/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
    access_log /var/log/nginx/bentorm.access.log;
    error_log  /var/log/nginx/bentorm.error.log;
}

# Bentorm admin panel — listens on 8082 (newadmin.<domain> in Nginx Proxy Manager). Same app, panel at /admin.
server {
    listen 8082;
    server_name _;
    root /opt/bentorm/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    location = / { return 302 /admin; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
    access_log /var/log/nginx/bentorm-admin.access.log;
    error_log  /var/log/nginx/bentorm-admin.error.log;
}
